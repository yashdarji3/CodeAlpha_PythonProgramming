<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-info {
            margin-bottom: 30px;
        }

        .current-player {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .score-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            min-width: 120px;
        }

        .score-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 30px auto;
            max-width: 300px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
        }

        .cell {
            width: 80px;
            height: 80px;
            background: white;
            border: none;
            border-radius: 10px;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .cell:hover {
            background: #e9ecef;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .cell.x {
            color: #e74c3c;
        }

        .cell.o {
            color: #3498db;
        }

        .cell:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .winning-cell {
            background: #2ecc71 !important;
            color: white !important;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .game-status {
            font-size: 1.3em;
            margin: 20px 0;
            min-height: 30px;
            font-weight: bold;
        }

        .game-status.winner {
            color: #2ecc71;
            animation: bounce 0.5s ease-in-out;
        }

        .game-status.draw {
            color: #f39c12;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 20px;
            }
            
            .cell {
                width: 60px;
                height: 60px;
                font-size: 1.5em;
            }
            
            .game-board {
                max-width: 240px;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 Tic Tac Toe</h1>
        
        <div class="game-info">
            <div class="current-player" id="currentPlayer">Player X's Turn</div>
            
            <div class="score">
                <div class="score-item">
                    <div class="score-label">Player X</div>
                    <div class="score-value" id="scoreX">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Draws</div>
                    <div class="score-value" id="scoreDraw">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Player O</div>
                    <div class="score-value" id="scoreO">0</div>
                </div>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="game-status" id="gameStatus"></div>

        <div class="buttons">
            <button class="btn btn-primary" onclick="resetGame()">New Game</button>
            <button class="btn btn-secondary" onclick="resetScore()">Reset Score</button>
        </div>
    </div>

    <script>
        class TicTacToe {
            constructor() {
                this.board = ['', '', '', '', '', '', '', '', ''];
                this.currentPlayer = 'X';
                this.gameActive = true;
                this.scores = {
                    X: parseInt(localStorage.getItem('scoreX')) || 0,
                    O: parseInt(localStorage.getItem('scoreO')) || 0,
                    draw: parseInt(localStorage.getItem('scoreDraw')) || 0
                };
                
                this.winningConditions = [
                    [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
                    [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
                    [0, 4, 8], [2, 4, 6]             // Diagonals
                ];
                
                this.initializeGame();
            }

            initializeGame() {
                this.updateDisplay();
                this.attachEventListeners();
            }

            attachEventListeners() {
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => {
                    cell.addEventListener('click', this.handleCellClick.bind(this));
                });
            }

            handleCellClick(event) {
                const clickedCell = event.target;
                const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

                if (this.board[clickedCellIndex] !== '' || !this.gameActive) {
                    return;
                }

                this.board[clickedCellIndex] = this.currentPlayer;
                this.updateCellDisplay(clickedCell, this.currentPlayer);
                this.checkResult();
            }

            updateCellDisplay(cell, player) {
                cell.textContent = player;
                cell.classList.add(player.toLowerCase());
                cell.disabled = true;
            }

            checkResult() {
                let roundWon = false;
                let winningCombination = null;

                for (let i = 0; i < this.winningConditions.length; i++) {
                    const [a, b, c] = this.winningConditions[i];
                    if (this.board[a] === '' || this.board[b] === '' || this.board[c] === '') {
                        continue;
                    }
                    if (this.board[a] === this.board[b] && this.board[b] === this.board[c]) {
                        roundWon = true;
                        winningCombination = [a, b, c];
                        break;
                    }
                }

                if (roundWon) {
                    this.handleWin(winningCombination);
                    return;
                }

                if (!this.board.includes('')) {
                    this.handleDraw();
                    return;
                }

                this.switchPlayer();
            }

            handleWin(winningCombination) {
                const gameStatus = document.getElementById('gameStatus');
                gameStatus.textContent = `🎉 Player ${this.currentPlayer} Wins!`;
                gameStatus.className = 'game-status winner';
                
                // Highlight winning cells
                winningCombination.forEach(index => {
                    const cell = document.querySelector(`[data-index="${index}"]`);
                    cell.classList.add('winning-cell');
                });
                
                this.scores[this.currentPlayer]++;
                this.saveScores();
                this.updateScoreDisplay();
                this.gameActive = false;
                this.disableAllCells();
            }

            handleDraw() {
                const gameStatus = document.getElementById('gameStatus');
                gameStatus.textContent = "🤝 It's a Draw!";
                gameStatus.className = 'game-status draw';
                
                this.scores.draw++;
                this.saveScores();
                this.updateScoreDisplay();
                this.gameActive = false;
            }

            switchPlayer() {
                this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X';
                this.updateCurrentPlayerDisplay();
            }

            updateDisplay() {
                this.updateCurrentPlayerDisplay();
                this.updateScoreDisplay();
            }

            updateCurrentPlayerDisplay() {
                const currentPlayerElement = document.getElementById('currentPlayer');
                if (this.gameActive) {
                    currentPlayerElement.textContent = `Player ${this.currentPlayer}'s Turn`;
                    currentPlayerElement.style.color = this.currentPlayer === 'X' ? '#e74c3c' : '#3498db';
                }
            }

            updateScoreDisplay() {
                document.getElementById('scoreX').textContent = this.scores.X;
                document.getElementById('scoreO').textContent = this.scores.O;
                document.getElementById('scoreDraw').textContent = this.scores.draw;
            }

            saveScores() {
                localStorage.setItem('scoreX', this.scores.X);
                localStorage.setItem('scoreO', this.scores.O);
                localStorage.setItem('scoreDraw', this.scores.draw);
            }

            disableAllCells() {
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => {
                    cell.disabled = true;
                });
            }

            resetGame() {
                this.board = ['', '', '', '', '', '', '', '', ''];
                this.currentPlayer = 'X';
                this.gameActive = true;
                
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => {
                    cell.textContent = '';
                    cell.disabled = false;
                    cell.className = 'cell';
                });
                
                const gameStatus = document.getElementById('gameStatus');
                gameStatus.textContent = '';
                gameStatus.className = 'game-status';
                
                this.updateDisplay();
            }

            resetScore() {
                this.scores = { X: 0, O: 0, draw: 0 };
                this.saveScores();
                this.updateScoreDisplay();
            }
        }

        // Initialize the game
        let game = new TicTacToe();

        // Global functions for buttons
        function resetGame() {
            game.resetGame();
        }

        function resetScore() {
            game.resetScore();
        }
    </script>
</body>
</html>
